# Retrieval system configuration

text_column: "narrative_clean"
top_k: 5

bm25:
  k1: 1.5
  b: 0.75

dense:
  model_name: "all-MiniLM-L6-v2"
  batch_size: 64
  index_type: "flat"        # "flat" (exact) or "ivf" (approximate, faster for large corpus)
  nlist: 100                # number of IVF clusters (only used when index_type = "ivf")

hybrid:
  bm25_weight: 0.4
  dense_weight: 0.6
