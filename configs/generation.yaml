# Structured output generation configuration

# LLM provider: "openai", "anthropic", or "mock" (for testing without API key)
provider: "mock"

openai:
  model: "gpt-4o-mini"
  temperature: 0.2
  max_tokens: 512

anthropic:
  model: "claude-3-haiku-20240307"
  temperature: 0.2
  max_tokens: 512

# Number of retrieved similar cases to include in the prompt
num_retrieved_cases: 3

# Confidence threshold below which the system flags for human review
confidence_threshold: 0.6

# Output schema keys (fixed — do not change without updating evaluation)
output_schema:
  - complaint_summary
  - predicted_issue
  - similar_cases
  - recommended_next_step
  - confidence
  - needs_human_review
